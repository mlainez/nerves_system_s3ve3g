# The bootloader's framebuffer (simpledrm) is the only display: these drivers
# would take the MDSS over and, without a working panel driver, leave the
# screen black. nerves_uevent loads modules by alias as devices appear;
# blacklisting stops that, while "modprobe msm" by name still works for a
# deliberate test.
blacklist msm
blacklist panel-htc-memul-novatek35521
blacklist panel-lg-lenok-lg4237
blacklist analogix-anx78xx
blacklist analogix_dp
blacklist udl
