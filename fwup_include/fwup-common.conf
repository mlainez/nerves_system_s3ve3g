#
# Firmware metadata
#

# All of these can be overriden using environment variables of the same name.
#
#  Run 'fwup -m' to query values in a .fw file.
#  Use 'fw_printenv' to query values on the target.
#
# These are used by Nerves libraries to introspect.
define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "s3ve3g")
define(NERVES_FW_ARCHITECTURE, "armv7")
define(NERVES_FW_AUTHOR, "Spin42")

# The initramfs looks the stock `userdata` partition up by its GPT name and
# publishes these aliases, so nothing here names an eMMC partition number.
# /dev/rootdisk0 points at the same device.
define(NERVES_FW_DEVPATH, "/dev/nerves-userdata")
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/nerves-app")
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "f2fs")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/root")

# Default paths if not specified via the commandline
define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

# The whole layout lives inside the stock Android `userdata` partition
# (mmcblk0p26, 24536415 blocks of 512 bytes = 11.70 GiB on the GT-I9301I).
# The bootloader chain cannot be repartitioned, so this is a partition table
# nested inside a partition. lk2nd publishes every GPT partition as a block
# device, parses an MBR inside each one, and scans the resulting leaves of
# 16 MiB or more for an ext2 filesystem with /extlinux/extlinux.conf. The
# initramfs maps the same MBR with kpartx.
#
# +----------------------------+ block 0
# | MBR (nested)               |
# +----------------------------+ 2048 (1 MiB)
# | Firmware config data       |
# | as uboot env (8 KiB)       |
# +----------------------------+ 2064
# | Boot A (ext2, 64 MiB)      |
# +----------------------------+ 133136
# | Boot B (ext2, 64 MiB)      |
# +----------------------------+ 264208
# | Rootfs A (squashfs 384 MiB)|
# +----------------------------+ 1050640
# | Rootfs B (squashfs 384 MiB)|
# +----------------------------+ 1837072
# | Application (f2fs)         |
# | 256 MiB, grows to the end  |
# | of userdata (block         |
# | 24536415) via grow-app     |
# +----------------------------+
#
# The MBR always lists the slot that boots next as partitions 1 and 2
# (boot, rootfs); the inactive slot is not in the table at all. Switching
# slots is one MBR write, which is all lk2nd needs to see.

define(UBOOT_ENV_OFFSET, 2048)
define(UBOOT_ENV_COUNT, 16)  # 8 KB

# Boot slots: kernel + DTB + initramfs + extlinux. lk2nd only scans
# partitions of 16 MiB or more, and gives kernel + initramfs + DTB 50 MiB of
# boot memory; 64 MiB leaves room on both counts.
define-eval(BOOT_A_PART_OFFSET, "${UBOOT_ENV_OFFSET} + ${UBOOT_ENV_COUNT}")
define(BOOT_A_PART_COUNT, 131072)
define-eval(BOOT_B_PART_OFFSET, "${BOOT_A_PART_OFFSET} + ${BOOT_A_PART_COUNT}")
define(BOOT_B_PART_COUNT, 131072)

define-eval(ROOTFS_A_PART_OFFSET, "${BOOT_B_PART_OFFSET} + ${BOOT_B_PART_COUNT}")
define(ROOTFS_A_PART_COUNT, 786432)
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

# Application partition. An image flashed raw (heimdall or fastboot) keeps
# this build-time size; the `grow-app` task in fwup-ops.conf rewrites the MBR
# with `expand = true` against the real userdata partition, and
# nerves_data_resize then grows the f2fs filesystem.
define-eval(APP_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(APP_PART_COUNT, 524288)

# Firmware archive metadata
meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}
