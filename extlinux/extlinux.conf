# Boot configuration read by lk2nd from the active boot subpartition.
#
# lk2nd (lk2nd/boot/extlinux.c) understands label, default, kernel/linux,
# initrd, fdt/devicetree, fdtdir and fdtoverlays. It does NOT understand
# `timeout` or `menu`, and always boots the `default` label: there is no
# interactive menu, so slot selection happens elsewhere. fwup rewrites the
# nested MBR in userdata so that its first partition is always the boot slot
# that should run; lk2nd finds this file there and nowhere else.
#
# Paths are absolute within this ext2 filesystem. lk2nd needs the DTB as a
# separate file: it patches memory, the command line and ramoops into it.
#
# Command line:
#   fbcon=rotate:1 fbcon=font:TER16x32  landscape console in a large font,
#       readable without a USB cable
#   loglevel=5  warnings and errors only on the screen, like `quiet` in the
#       official systems, one level up so the initramfs and s3ve3g-bringup
#       lines (written to /dev/kmsg at the default level 4) stay visible: the
#       screen is the only console without a USB cable
#   clk_ignore_unused pd_ignore_unused  keep the display clocks and power
#       domain the bootloader left on; simpledrm drives that framebuffer
#   reboot=warm  a warm reset keeps IMEM, where `reboot download` leaves the
#       magic Samsung aboot reads to enter Odin mode
#   qcom_smbb.trace=0  no periodic charger supervisor trace in the kernel
#       log; /sys/module/qcom_smbb/parameters/trace turns it on when needed
#   lk2nd.pass-ramoops  the previous kernel log survives a reboot into lk2nd
#   nerves_base=userdata  the initramfs finds the GPT partition named
#       `userdata`, maps its nested MBR with kpartx and mounts partition 2
default nerves

label nerves
	kernel /zImage
	fdt /qcom-msm8226-samsung-s3ve3g.dtb
	initrd /initramfs.gz
	append console=tty0 fbcon=rotate:1 fbcon=font:TER16x32 loglevel=5 clk_ignore_unused pd_ignore_unused panic=10 reboot=warm qcom_smbb.trace=0 lk2nd.pass-ramoops nerves_base=userdata rootfstype=squashfs ro rootwait
